<title>Buyer Login | Steal An Egg</title>
<style>

<body>
<div class="shell">
  <header class="brand">
    <strong>STEAL AN EGG</strong>
    <p>BUYER ACCESS PORTAL</p>
  </header>

  <main class="card">
    <header class="head">
      <div class="eyebrow">● Secure buyer access</div>
      <h1>Welcome back.</h1>
      <p class="subtitle">Sign in with the buyer credentials supplied by your administrator.</p>
    </header>

    <div class="body">
      <form id="loginForm">
        <label for="email">Buyer email</label>
        <input id="email" name="email" type="email"
          autocomplete="username" inputmode="email"
          maxlength="254" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          autocomplete="current-password" required>

        <button id="loginButton" type="submit">Sign in securely →</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"
        data-kind="info">Ready to sign in.</div>
    </div>
  </main>

  <footer class="footer">
    Steal An Egg · Buyer Portal<br>
    Keep your password and API key private.
  </footer>
</div>

<script>
(() => {
  'use strict';

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const button = document.getElementById('loginButton');
  const statusBox = document.getElementById('status');

  let busy = false;

  function showStatus(message, kind = 'info') {
    statusBox.textContent = message;
    statusBox.dataset.kind = kind;
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;

    busy = true;
    button.disabled = true;
    showStatus('Checking your credentials…', 'loading');

    try {
      const response = await fetch('/api/buyer/login', {
        method: 'POST',
        headers: {
          Accept: 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          password: passwordInput.value
        }),
        cache: 'no-store',
        credentials: 'same-origin',
        redirect: 'error'
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(
          data.error || data.message ||
          `Login failed (HTTP ${response.status})`
        );
      }

      /*
       * Do not put a returned bearer token in the URL.
       * This page redirects only after a successful server response.
       * The destination must implement its own authenticated session.
       */
      showStatus('Login successful. Opening buyer portal…', 'success');
      passwordInput.value = '';

      window.location.assign('/get-key');
    } catch (error) {
      showStatus('Sign-in failed: ' + error.message, 'error');
    } finally {
      busy = false;
      button.disabled = false;
    }
  });
})();
</script>
</body>
